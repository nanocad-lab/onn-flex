# Test Case 1: VGG11 Fourier Backend with Contamination
# Force 100% overlap/contamination by using zero separation and small lens
dataset: cifar10
model_arch: ftvgg11
conv_backend: fourier

# Geometry
jtc_total_field: 16
input_length: 13
kernel_length: 3
jtc_separation: 0
# Force system to use stride of 13 despite contamination
override_effective_stride: 13
output_length: 13

# No Quantization
adc_bits: null
dac_bits: null
fourier_plane_bits: null

# Training
batch_size: 32
learning_rate: 0.001
num_epochs: 1
output_dir: runs/test_vgg11_fourier_contam
