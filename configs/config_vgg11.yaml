model_name: vgg11
config_file: config_vgg11.yaml
output_dir: ./output_vgg11

# Treat these as maximum lengths; builder will auto-plan tighter sizes.
input_length: 32
kernel_length: 8
auto_plan_jtc_lengths: true

jtc_separation: 8
jtc_total_field: 64

conv_backend: fourier
scale_output: "none"
dac_bits: 4
adc_bits: 6
fourier_plane_bits: 6
quantizer: ste_clipped

# Distortion data (matches existing component CSVs)
driver_distortion_data_path: ./component_data/driver_sim_data.csv
pd_tia_distortion_data_path: ./component_data/pd_tia_sim_data.csv
pd_distortion_data_path: ./component_data/pd_sim_data.csv
tia_distortion_data_path: ./component_data/tia_sim_data.csv
mrm_phase_data_path: ./component_data/mrm_phase_sim_data.csv
mrm_power_data_path: ./component_data/mrm_pwr_w_sim_data.csv

driver_distortion_strength: 0.0
pd_tia_distortion_strength: 0.0
pd_distortion_strength: 0.0
tia_distortion_strength: 0.0
mrm_phase_distortion_strength: 0.0
mrm_power_distortion_strength: 0.0
ler_std_dev: 0.0

# Training overrides
num_identical_layers: 0
num_epochs: 20
learning_rate: 0.001
batch_size: 1
eval_only: False
pretrained_weights: ""
run_pretrain_tests: True
loss: 0.96
