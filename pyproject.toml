[tool.black]
line-length = 88
target-version = ["py310"]
force-exclude = '/(runs|runs_mfd|data|papers|experiments|context|testout|sweep_results)/'

[tool.ruff]
line-length = 88
target-version = "py310"
force-exclude = true
extend-exclude = ["runs", "runs_mfd", "data", "papers", "experiments", "context", "testout", "sweep_results"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
# Length validation for existing zip calls is outside this style cleanup.
ignore = ["B905"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
norecursedirs = [".git", ".venv", "runs", "runs_mfd", "data", "papers", "experiments", "context"]
addopts = "--strict-markers --strict-config"
