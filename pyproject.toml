[tool.black]
line-length = 88

[tool.ruff]
line-length = 88

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_ignores = true
ignore_missing_imports = true
show_error_codes = true

[[tool.mypy.overrides]]
# Legacy template not maintained for typing
module = ["old_template"]
ignore_errors = true
